<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Entry - Bhubaneswari OCP Production</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hdr" class="top"></header>
<main>
  <div id="msg" class="msg" style="display:none"></div>

  <form id="f" class="card" autocomplete="off">
    <h2 id="ftitle">Enter shift production</h2>
    <div class="grid">
      <div><label for="log_date">Date</label><input type="date" id="log_date" required></div>
      <div class="full" id="modebox"><label for="mode">Entry type</label>
        <select id="mode"><option value="shift">One shift</option><option value="day">Whole day (split equally into shifts A, B and C)</option></select></div>
      <div id="shiftbox"><label for="shift">Shift</label>
        <select id="shift" required><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>

      <div class="full sect">Coal</div>
      <div><label for="coal_target" class="lb">Coal Target (T)</label><input type="number" id="coal_target" min="0" step="any" inputmode="decimal" required></div>
      <div><label for="coal_actual" class="lb">Coal Actual (T)</label><input type="number" id="coal_actual" min="0" step="any" inputmode="decimal" required></div>

      <div class="full sect">Overburden (OB)</div>
      <div><label for="ob_target" class="lb">OB Target (m³)</label><input type="number" id="ob_target" min="0" step="any" inputmode="decimal" required></div>
      <div><label for="ob_actual" class="lb">OB Actual (m³)</label><input type="number" id="ob_actual" min="0" step="any" inputmode="decimal" required></div>

      <div class="full">
        <div class="calc" id="calc">
          <div><span>Coal shortfall (T)</span><b id="c_cs">-</b></div>
          <div><span>Coal achievement</span><b id="c_ca">-</b></div>
          <div><span>OB shortfall (m³)</span><b id="c_os">-</b></div>
          <div><span>OB achievement</span><b id="c_oa">-</b></div>
        </div>
      </div>

      <div class="full" id="splitbox" style="display:none"><div class="msg info" id="splittxt" style="margin:0"></div></div>

      <div class="full sect">Shortfall details</div>
      <div><label for="shortfall_reason">Shortfall Reason <span class="hint">(needed if below target)</span></label>
        <select id="shortfall_reason"></select></div>
      <div><label for="delay_hours">Delay Hours</label><input type="number" id="delay_hours" min="0" max="24" step="0.25" value="0" inputmode="decimal"></div>
      <div class="full"><label for="remarks">Detailed Remarks</label><textarea id="remarks"></textarea></div>
      <div class="full"><label for="corrective_action">Corrective Action</label><textarea id="corrective_action"></textarea></div>
      <div><label for="urgency">Urgency</label>
        <select id="urgency"><option>Low</option><option>Medium</option><option>High</option></select></div>
      <div><label for="status">Status</label>
        <select id="status"><option>Open</option><option>In progress</option><option>Resolved</option></select></div>
      <div class="full"><div class="actions"><button type="submit" id="save">Save shift entry</button><a class="btn alt" id="cancel" href="index.html" style="display:none">Cancel edit</a></div></div>
    </div>
  </form>

  <div class="card">
    <h2>Recent entries</h2>
    <div id="recent">Loading...</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
renderHeader("index.html");
const db = makeClient();
const $ = (id) => document.getElementById(id);
const editId = new URLSearchParams(location.search).get("id");

function reasonOptions(extra) {
  const list = REASONS.slice();
  if (extra && list.indexOf(extra) === -1) list.push(extra);
  $("shortfall_reason").innerHTML = '<option value="">-- none --</option>' +
    list.map((r) => '<option>' + esc(r) + '</option>').join("");
}
reasonOptions();
$("log_date").value = isoDate(new Date());

function showCalc() {
  const ct = num($("coal_target").value), ca = num($("coal_actual").value);
  const ot = num($("ob_target").value), oa = num($("ob_actual").value);
  const has = (id) => $(id).value !== "";
  const paint = (id, v, ok) => { $(id).textContent = ok ? v : "-"; };
  paint("c_cs", fmt(ct - ca, 1), has("coal_target") && has("coal_actual"));
  paint("c_ca", pctText(pct(ca, ct)), has("coal_target") && has("coal_actual"));
  paint("c_os", fmt(ot - oa, 1), has("ob_target") && has("ob_actual"));
  paint("c_oa", pctText(pct(oa, ot)), has("ob_target") && has("ob_actual"));
}
["coal_target","coal_actual","ob_target","ob_actual"].forEach((id) => $(id).addEventListener("input", showCalc));

/* ---- Whole-day mode: one daily figure is split equally into shifts A, B, C ---- */
const SHIFTS = ["A", "B", "C"];
function splitAmt(total) {
  const a = Math.round(total / 3 * 100) / 100;
  return [a, a, Math.round((total - 2 * a) * 100) / 100];
}
function dayMode() { return !editId && $("mode").value === "day"; }
function updateMode() {
  const d = dayMode();
  $("shiftbox").style.display = d ? "none" : "block";
  $("splitbox").style.display = d ? "block" : "none";
  const p = d ? "Daily " : "";
  [["coal_target","Coal Target (T)"],["coal_actual","Coal Actual (T)"],["ob_target","OB Target (m³)"],["ob_actual","OB Actual (m³)"]]
    .forEach((x) => { document.querySelector('label[for="' + x[0] + '"]').textContent = p + x[1]; });
  $("save").textContent = d ? "Save whole day (A + B + C)" : (editId ? "Save changes" : "Save shift entry");
  $("delay_hours").previousElementSibling.textContent = d ? "Delay Hours (whole day)" : "Delay Hours";
  showSplit();
}
function showSplit() {
  if (!dayMode()) return;
  const ct = splitAmt(num($("coal_target").value)), ca = splitAmt(num($("coal_actual").value));
  const ot = splitAmt(num($("ob_target").value)), oa = splitAmt(num($("ob_actual").value));
  $("splittxt").innerHTML = "Each shift gets one third. Shift A: coal " + fmt(ca[0], 2) + " of " + fmt(ct[0], 2) + " T, OB " + fmt(oa[0], 2) + " of " + fmt(ot[0], 2) +
    " m³. Shifts B and C get the same (the last shift takes any rounding). Every shift will show the same achievement %. Use One shift for real shift-wise numbers.";
}
$("mode").addEventListener("change", updateMode);
["coal_target","coal_actual","ob_target","ob_actual"].forEach((id) => $(id).addEventListener("input", showSplit));

function readForm() {
  return {
    log_date: $("log_date").value, shift: $("shift").value, location: LOCATION,
    coal_target: num($("coal_target").value), coal_actual: num($("coal_actual").value),
    ob_target: num($("ob_target").value), ob_actual: num($("ob_actual").value),
    shortfall_reason: $("shortfall_reason").value || null,
    delay_hours: num($("delay_hours").value),
    remarks: $("remarks").value.trim() || null,
    corrective_action: $("corrective_action").value.trim() || null,
    urgency: $("urgency").value, status: $("status").value, is_void: false
  };
}

async function loadForEdit() {
  if (!editId) return;
  if (!db) return showMsg("msg", "err", NOT_READY);
  const r = await db.from("production_log").select("*").eq("id", editId).maybeSingle();
  if (r.error || !r.data) return showMsg("msg", "err", "Could not open that record for editing. " + (r.error ? "Error: " + errText(r.error) : "It was not found."));
  const x = r.data;
  reasonOptions(x.shortfall_reason);
  ["log_date","shift","coal_target","coal_actual","ob_target","ob_actual","delay_hours","remarks","corrective_action","urgency","status"]
    .forEach((k) => { $(k).value = x[k] == null ? "" : x[k]; });
  $("shortfall_reason").value = x.shortfall_reason || "";
  $("modebox").style.display = "none"; updateMode();
  $("ftitle").textContent = "Edit record: " + x.log_date + ", shift " + x.shift;
  $("save").textContent = "Save changes";
  $("cancel").style.display = "inline-block";
  showCalc();
}

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!db) return showMsg("msg", "err", NOT_READY);
  const row = readForm();
  const below = row.coal_actual < row.coal_target || row.ob_actual < row.ob_target;
  if (below && !row.shortfall_reason) {
    showMsg("msg", "info", "Actual is below target. Please choose a Shortfall Reason.");
    $("shortfall_reason").focus();
    return;
  }
  $("save").disabled = true;
  try {
    let res;
    let savedTxt = "shift " + row.shift + " on " + row.log_date;
    if (editId) {
      res = await db.from("production_log").update(row).eq("id", editId);
    } else if (dayMode()) {
      const parts = {};
      ["coal_target","coal_actual","ob_target","ob_actual","delay_hours"].forEach((k) => { parts[k] = splitAmt(row[k]); });
      const found = await db.from("production_log").select("id,shift").eq("log_date", row.log_date);
      if (found.error) throw found.error;
      if (found.data.length && !confirm(row.log_date + " already has entries (or removed ones) for shift(s) " + found.data.map((x) => x.shift).join(", ") + ". Replace them with these numbers?")) {
        $("save").disabled = false; return;
      }
      for (let i = 0; i < 3; i++) {
        const r3 = Object.assign({}, row, {shift: SHIFTS[i]});
        Object.keys(parts).forEach((k) => { r3[k] = parts[k][i]; });
        const old = found.data.find((x) => x.shift === SHIFTS[i]);
        res = old ? await db.from("production_log").update(r3).eq("id", old.id) : await db.from("production_log").insert(r3);
        if (res.error) throw res.error;
      }
      savedTxt = "whole day " + row.log_date + " (shifts A, B and C)";
    } else {
      const found = await db.from("production_log").select("id").eq("log_date", row.log_date).eq("shift", row.shift);
      if (found.error) throw found.error;
      if (found.data.length) {
        if (!confirm("Shift " + row.shift + " on " + row.log_date + " already has an entry (or a removed one). Replace it with these numbers?")) {
          $("save").disabled = false; return;
        }
        res = await db.from("production_log").update(row).eq("id", found.data[0].id);
      } else {
        res = await db.from("production_log").insert(row);
      }
    }
    if (res.error) throw res.error;
    showMsg("msg", "ok", "Saved: " + savedTxt + ".");
    if (editId) { setTimeout(() => { location.href = "records.html"; }, 900); return; }
    ["coal_target","coal_actual","ob_target","ob_actual","remarks","corrective_action"].forEach((id) => { $(id).value = ""; });
    $("shortfall_reason").value = ""; $("delay_hours").value = 0;
    $("urgency").value = "Low"; $("status").value = "Open";
    showCalc(); showSplit(); loadRecent();
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (e) {
    const dup = e && e.code === "23505" ? " Another entry already exists for that date and shift." : "";
    showMsg("msg", "err", "Sorry, the entry could not be saved." + dup + " Please send this error text to the team: " + errText(e) + NEED_03);
  }
  $("save").disabled = false;
});

async function loadRecent() {
  const box = $("recent");
  if (!db) { box.textContent = NOT_READY; return; }
  const r = await db.from("production_log").select("*").eq("is_void", false).order("log_date", {ascending: false}).order("shift", {ascending: false}).limit(15);
  if (r.error) { box.innerHTML = '<div class="msg err">Could not load entries. Error: ' + esc(errText(r.error)) + esc(NEED_03) + '</div>'; return; }
  if (!r.data.length) { box.textContent = "No entries yet. Add the first shift above."; return; }
  box.innerHTML = r.data.map((x) => {
    const cp = pct(x.coal_actual, x.coal_target), op = pct(x.ob_actual, x.ob_target);
    return '<div class="rec"><div class="h"><span>' + esc(x.log_date) + ' - Shift ' + esc(x.shift) + '</span>' +
      '<span class="tag ' + esc(x.urgency) + '">' + esc(x.urgency) + '</span></div>' +
      '<p>Coal: ' + fmt(x.coal_actual) + ' / ' + fmt(x.coal_target) + ' T ' + badge(cp) + '<br>' +
      'OB: ' + fmt(x.ob_actual) + ' / ' + fmt(x.ob_target) + ' m³ ' + badge(op) + '</p>' +
      (x.shortfall_reason ? '<p>Reason: ' + esc(x.shortfall_reason) + ' (' + fmt(x.delay_hours, 2) + ' h delay)</p>' : '') +
      '<p><label>Status</label><select data-id="' + esc(x.id) + '" class="st-sel">' +
      ["Open","In progress","Resolved"].map((s) => '<option' + (s === x.status ? ' selected' : '') + '>' + s + '</option>').join("") +
      '</select></p><p><a class="btn alt sm" href="index.html?id=' + esc(x.id) + '">Edit this record</a></p></div>';
  }).join("");
  box.querySelectorAll(".st-sel").forEach((sel) => sel.addEventListener("change", async () => {
    const u = await db.from("production_log").update({status: sel.value}).eq("id", sel.dataset.id);
    if (u.error) showMsg("msg", "err", "Could not change status. Error: " + errText(u.error));
    else showMsg("msg", "ok", "Status updated to " + sel.value + ".");
  }));
}
updateMode();
loadForEdit();
loadRecent();
</script>
</body>
</html>
